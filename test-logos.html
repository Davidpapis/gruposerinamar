<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Logo Test</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #eee; }
    .row { display: flex; gap: 20px; margin-bottom: 20px; }
    .box { flex: 1; padding: 30px; text-align: center; border-radius: 8px; }
    .light { background: #ffffff; color: #111; border: 1px solid #ccc; }
    .dark { background: #0f172a; color: #fff; }
    .gold { background: #fdf8f0; border: 1px solid #e0c8a0; }
    img { max-width: 280px; max-height: 120px; object-fit: contain; }
  </style>
</head>
<body>
  <h1>Test Logos Grupo Serinamar</h1>
  <h2>Light Background</h2>
  <div class="row">
    <div class="box light">
      <h3>Grupo Serinamar</h3>
      <img src="public/images/logos/serinamar-logo.png" alt="Serinamar">
    </div>
    <div class="box light">
      <h3>Just Banús</h3>
      <img src="public/images/logos/just-banus-logo.png" alt="Just Banus">
    </div>
    <div class="box light">
      <h3>Iberian Sun</h3>
      <img src="public/images/logos/iberian-sun-logo.png" alt="Iberian Sun">
    </div>
    <div class="box light">
      <h3>Los Naranjos</h3>
      <img src="public/images/logos/los-naranjos-logo.png" alt="Los Naranjos">
    </div>
  </div>
  <h2>Dark Background</h2>
  <div class="row">
    <div class="box dark">
      <h3>Grupo Serinamar</h3>
      <img src="public/images/logos/serinamar-logo.png" alt="Serinamar">
    </div>
    <div class="box dark">
      <h3>Just Banús</h3>
      <img src="public/images/logos/just-banus-logo.png" alt="Just Banus">
    </div>
    <div class="box dark">
      <h3>Iberian Sun</h3>
      <img src="public/images/logos/iberian-sun-logo.png" alt="Iberian Sun">
    </div>
    <div class="box dark">
      <h3>Los Naranjos</h3>
      <img src="public/images/logos/los-naranjos-logo.png" alt="Los Naranjos">
    </div>
  </div>
</body>
</html>
